security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 token signed with the server [jwt] key; claims user_id (NIK), expire_at (Unix seconds). On dev: test tokens per role.'
    jobBasicAuth:
      type: http
      scheme: basic
      description: '[public_api] username / password; only the background-job service knows it.'

  parameters:
    Page:
      name: page
      in: query
      description: Page number, from 1 (0 or below = 422).
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      description: Ignored for the row count (always 20) but echoed in the envelope; send 20.
      schema: {type: integer, default: 20}
    Limit:
      name: limit
      in: query
      description: Rows per page (or `per_page`), default 20, max 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    PerPageSized:
      name: per_page
      in: query
      description: Same as `limit` (used when `limit` is not sent); also echoed in the envelope.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Q:
      name: q
      in: query
      description: Search text (site name).
      schema: {type: string}
    SortDir:
      name: sort_dir
      in: query
      schema: {type: string, enum: [asc, desc], default: asc}
    LatRequired:
      name: lat
      in: query
      required: true
      schema: {type: number, format: double, example: -6.2615}
    LngRequired:
      name: lng
      in: query
      required: true
      schema: {type: number, format: double, example: 106.8106}
    TaskOrSiteId:
      name: id
      in: path
      required: true
      description: task_id (`TS` + date + 6 digits) or site_id (`SD28102026001`; old `ST` + date + 6 digits; a slashed `SD27/10/2026001` as its twin `SD27-10-2026001`)
      schema: {type: string, example: SD28102026001}
    SiteIdInPathAsId:
      name: id
      in: path
      required: true
      description: site_id as is (`SD28102026001`, old `ST…`); a slashed `SD27/10/2026001` as its twin `SD27-10-2026001` (or `%2F`)
      schema: {type: string, example: SD28102026001}
    SiteIdPath:
      name: site_id
      in: path
      required: true
      description: site_id as is (`SD28102026001`, old `ST…`); a slashed `SD27/10/2026001` as its twin `SD27-10-2026001` (or `%2F`)
      schema: {type: string, example: SD28102026001}
    UserIdPath:
      name: id
      in: path
      required: true
      description: user_id (NIK)
      schema: {type: integer, format: int64, example: 90000103}

  responses:
    OkNoData:
      description: Done (no data)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
          example: {code: 200, status: success}
    Unauthorized:
      description: Bad / expired token, or the user is not in the Users table
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            bad-token: {value: {code: 401, status: failure, message: Unauthorized, errors: {error: Unauthorized}}}
            expired: {value: {code: 401, status: failure, message: Your token is expired}}
            unknown-user: {value: {code: 401, status: failure, message: Unauthorized, errors: {error: user not found}}}
    NoToken:
      description: No Authorization header
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 403, status: failure, message: Forbidden, errors: {error: Forbidden}}
    NotAdmin:
      description: Not ADMIN (or no token)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 403, status: failure, message: Forbidden, errors: {error: hanya admin yang bisa mengakses fitur ini}}
    PortalStaff:
      description: Site staff (USER) cannot open the portal (or no token)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 403, status: failure, message: Forbidden, errors: {error: Portal Site Dev hanya untuk pengguna kantor}}
    BadPage:
      description: page below 1
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 422, status: failure, message: Unprocessable Entity, errors: {page: Invalid page number}}
    BadLatLng:
      description: lat / lng missing or not a number
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 422, status: failure, message: Unprocessable Entity, errors: {lat: The lat is invalid value.}}
    BadId:
      description: id is not a number
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 422, status: failure, message: Unprocessable Entity, errors: {id: The id is invalid value.}}
    SurveyValidation:
      description: Survey field rules
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 422, status: failure, message: Unprocessable Entity, errors: {vehicle_traffic_minutes: The vehicle traffic minutes field is required when vehicle traffic count is present.}}
    RecordNotFound:
      description: Unknown id (old behaviour kept from site-dev-api - 500, not 404)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 500, status: failure, message: Internal Server Error, errors: {error: record not found}}
    ServerError:
      description: Server error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 500, status: failure, message: Internal Server Error, errors: {error: '...'}}
    AIEmptyInputs:
      description: |
        (baru, 27 Okt) The survey is empty: no AI call, nothing counted. At least ONE survey input must be filled:
        foot traffic, peak hours, vehicle traffic (level, count or note), parking (availability or note), public
        transport, landmark, demographics, competitor note, or an extra note. Name + pin + sales area alone are not
        enough; competitor rows (filled from the map) do not count. Disable the AI button with this hint.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 400, status: failure, message: Bad Request, errors: {error: 'Analisis AI belum bisa dibuat: data survei masih kosong. Isi minimal satu: keramaian orang lewat, jam ramai, lalu lintas kendaraan, parkir, transportasi umum, landmark sekitar, penduduk sekitar, catatan kompetitor, atau catatan tambahan.'}}
    AIUnchanged:
      description: |
        (baru, 27 Okt) The inputs (pin, address parts, sales area, 24 h / alcohol, survey, competitor rows, notes;
        not the name) are the same as for the site's newest AI result: no new call, nothing counted. Show the text and
        keep the current result. There is no "force" option.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 409, status: failure, message: Conflict, errors: {error: Data belum berubah sejak analisis terakhir. Ubah data survei atau lokasi dulu untuk membuat analisis baru.}}
    AILimit:
      description: An AI limit is reached (per staff per day, per site location, or per day for everyone)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            per-staff: {value: {code: 429, status: failure, message: Too Many Requests, errors: {error: Kuota generate AI insight harian (10) sudah habis, coba lagi besok.}}}
            per-site: {value: {code: 429, status: failure, message: Too Many Requests, errors: {error: Batas analisis AI untuk lokasi ini sudah tercapai (5x).}}}
            per-day: {value: {code: 429, status: failure, message: Too Many Requests, errors: {error: 'Batas analisis AI hari ini untuk semua pengguna sudah tercapai (60x), coba lagi besok.'}}}
    AIOff:
      description: AI is off on this server (no Gemini key) or Google refused the key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 503, status: failure, message: Service Unavailable, errors: {error: 'Analisis AI belum aktif di server ini (kunci Gemini belum diisi, gemini.apikey).'}}
    AIBadGateway:
      description: Gemini failed to answer
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 502, status: failure, message: Bad Gateway, errors: {error: Analisis AI tidak tersedia sekarang (Gemini gagal menjawab). Coba lagi sebentar lagi.}}
    AITimeout:
      description: Gemini did not answer in time (60 s per try)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 504, status: failure, message: Gateway Timeout, errors: {error: 'Analisis AI tidak tersedia: Gemini tidak menjawab tepat waktu. Coba lagi sebentar lagi.'}}
    GeocodingLimit:
      description: Per-user daily quota or server daily cap reached
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          example: {code: 429, status: failure, message: Too Many Requests, errors: {error: Kuota reverse-geocode harian (100) sudah habis, coba lagi besok.}}
    GeocodingOff:
      description: Switched off, no key, or Google refused the key
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
          examples:
            off: {value: {code: 503, status: failure, message: Service Unavailable, errors: {error: 'Alamat otomatis (Google Geocoding) belum diaktifkan di server ini ([geocoding] enabled = false).'}}}
            no-key: {value: {code: 503, status: failure, message: Service Unavailable, errors: {error: Kunci Google Geocoding belum diisi di server ini (geocoding.apikey).}}}
    BasicAuthFailed:
      description: Basic auth missing or wrong (plain JSON, not the envelope)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
          example: {error: Basic auth required}

  schemas:
    WibTime:
      type: string
      format: date-time
      description: WIB wall-clock time written with a Z (do not add 7 hours).
      example: '2026-10-27T09:15:00Z'
    Envelope:
      type: object
      description: familabs answer envelope; empty fields are left out.
      properties:
        code: {type: integer, example: 200}
        status: {type: string, enum: [success, failure]}
        message: {type: string, description: HTTP status text on errors; the service name on the health check}
        data: {description: The answer}
        errors:
          type: object
          additionalProperties: {type: string}
          description: '{"error": "..."} or one entry per invalid field (422)'
        total: {type: integer, format: int64}
        page: {type: integer}
        per_page: {type: integer}
      required: [code]
    ListEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          description: total / page / per_page are present only when total > 0.
    ErrorEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            status: {type: string, enum: [failure]}
    StatusCount:
      type: object
      properties:
        task_status: {type: string, example: WAITING_DEPT_HEAD}
        count: {type: integer, format: int64}
    TaskStatus:
      type: string
      enum: [DRAFT, WAITING_DEPT_HEAD, WAITING_DIV_HEAD, HOLD_DEPT_HEAD, HOLD_DIV_HEAD, REVISION, REJECTED, COMPLETED, CANCELLED]
    TaskRow:
      type: object
      properties:
        task_id: {type: string}
        site_id: {type: string}
        site_name_1: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_address_3: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        created_by: {type: integer, format: int64}
        updated_by: {type: integer, format: int64}
        created_at: {$ref: '#/components/schemas/WibTime'}
        updated_at: {$ref: '#/components/schemas/WibTime'}
        submit_count: {type: integer, description: 'Times sent; > 1 = "Pernah dikirim sebelumnya". Left out on old rows.'}
        rejected_by_role: {type: string, description: For REVISION / REJECTED - the role that returned it. Left out otherwise.}
    TaskHistory:
      type: object
      properties:
        id: {type: integer}
        action:
          type: string
          enum: [CREATE, UPDATE, SUBMIT, RESUBMIT, APPROVE, REJECT, REVISION, FORWARD, COMPLETE, HOLD, RELEASE, CANCEL, DUPLICATE_CONFIRMED]
        actor_id: {type: integer, format: int64}
        notes:
          type: string
          example: Revisi dari Dept Head Uji Dept Head dengan catatan (foto tampak depan kurang jelas)
          description: |
            Text for Riwayat. Since 28 Okt the decisions use the app's status words, role first:
            `APPROVE` "Disetujui oleh {peran} {nama}", `REJECT` "Ditolak Final oleh {peran} {nama}",
            `REVISION` "Revisi dari {peran} {nama}", each + " dengan catatan (…)" when a note was written;
            `FORWARD` "Diteruskan ke Div Head". Rows written before keep their old text
            ("Site di approve oleh …", "Site di reject oleh …", "Site diminta revisi oleh …",
            "Approval diteruskan ke …, status PENDING"). `COMPLETE` stays "Task Complete".
        created_at: {$ref: '#/components/schemas/WibTime'}
        actor_role: {type: string, description: Role at that moment; left out on old rows}
        round: {type: integer, description: Submit round; left out on old rows}
    ApprovalLevel:
      type: object
      properties:
        id: {type: integer}
        level: {type: integer, example: 1}
        approver_role_id: {type: string, example: DEPT_HEAD}
        approver_id: {type: integer, format: int64}
        approver_name: {type: string}
        status: {type: string, enum: [WAITING, PENDING, APPROVED, REJECTED, REVISION, HOLD]}
        notes: {type: string}
        created_at: {$ref: '#/components/schemas/WibTime'}
        acted_at: {allOf: [{$ref: '#/components/schemas/WibTime'}], nullable: true}
    TaskAttachment:
      type: object
      properties:
        id: {type: integer}
        file_name: {type: string}
        file_url: {type: string}
        uploaded_by: {type: integer, format: int64}
        uploaded_at: {$ref: '#/components/schemas/WibTime'}
    TaskSection:
      type: object
      properties:
        task_id: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        approval: {type: array, items: {$ref: '#/components/schemas/ApprovalLevel'}}
        history: {type: array, items: {$ref: '#/components/schemas/TaskHistory'}}
        submit_count: {type: integer}
        rejected_by_role: {type: string}
    TaskDetail:
      type: object
      properties:
        site: {$ref: '#/components/schemas/Site'}
        context: {allOf: [{$ref: '#/components/schemas/SiteContext'}], nullable: true}
        task: {$ref: '#/components/schemas/TaskSection'}
        attachment: {type: array, items: {$ref: '#/components/schemas/TaskAttachment'}}
    Site:
      type: object
      properties:
        site_id: {type: string, example: SD28102026001}
        site_name_1: {type: string, example: Uji Kemang Raya}
        site_name_2: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_address_3: {type: string}
        site_postal_code: {type: string}
        site_district: {type: string}
        site_city: {type: string}
        site_region: {type: string}
        site_lat: {type: number, format: double}
        site_lon: {type: number, format: double}
        site_telepon: {type: string}
        site_telepon_ext: {type: string}
        site_mobile_phone: {type: string}
        site_pic: {type: string, description: owner / contact name}
        site_fax: {type: string}
        site_planned_opening_date: {type: string, description: 'YYYY-MM-DD or ""', example: '2027-03-01'}
        site_sales_area: {type: number, description: m2}
        site_selling_alcohol: {type: boolean}
        site_open_24_hours: {type: boolean}
        created_by: {type: integer, format: int64}
        created_by_name: {type: string, description: left out when empty}
        updated_by: {type: integer, format: int64, nullable: true}
        updated_by_name: {type: string, description: left out when empty}
        created_at: {$ref: '#/components/schemas/WibTime'}
        updated_at: {allOf: [{$ref: '#/components/schemas/WibTime'}], nullable: true}
    SiteInput:
      type: object
      required: [site_name_1]
      description: 'To SEND, only site_name_1, site_lat/site_lon (valid, not 0,0) and site_sales_area (> 0) are needed.'
      properties:
        site_id: {type: string, description: empty = new site}
        site_name_1: {type: string, description: Nama site / Nama lokasi}
        site_name_2: {type: string}
        site_address_1: {type: string, description: Jalan dan nomor}
        site_address_2: {type: string}
        site_address_3: {type: string}
        site_postal_code: {type: string}
        site_district: {type: string, description: kecamatan}
        site_city: {type: string}
        site_region: {type: string, description: provinsi}
        site_lat: {type: number, format: double, minimum: -90, maximum: 90}
        site_lon: {type: number, format: double, minimum: -180, maximum: 180}
        site_telepon: {type: string}
        site_telepon_ext: {type: string}
        site_mobile_phone: {type: string}
        site_pic: {type: string}
        site_fax: {type: string}
        site_planned_opening_date: {type: string, format: date, description: 'YYYY-MM-DD or ""'}
        site_sales_area: {type: number, description: Sales Area in m2}
        site_selling_alcohol: {type: boolean}
        site_open_24_hours: {type: boolean}
    PreviewSiteInput:
      type: object
      required: [site_lat, site_lon]
      properties:
        site_name_1: {type: string}
        site_name_2: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_address_3: {type: string}
        site_postal_code: {type: string}
        site_district: {type: string}
        site_city: {type: string}
        site_region: {type: string}
        site_lat: {type: number, format: double, description: required, not 0}
        site_lon: {type: number, format: double, description: required, not 0}
        site_planned_opening_date: {type: string, format: date}
        site_sales_area: {type: number}
        site_selling_alcohol: {type: boolean}
        site_open_24_hours: {type: boolean}
    SiteUpsertInput:
      type: object
      required: [site]
      properties:
        site: {$ref: '#/components/schemas/SiteInput'}
        context: {allOf: [{$ref: '#/components/schemas/SiteContextInput'}], nullable: true, description: survey; null / missing = not changed}
        attachment:
          type: array
          description: photos already uploaded with POST /v1/upload/add; when sent, replaces all
          items:
            type: object
            required: [file_name, path]
            properties:
              file_name: {type: string}
              path: {type: string}
        notes: {type: string, maxLength: 500, description: history note (optional)}
        insight: {allOf: [{$ref: '#/components/schemas/AIInsight'}], nullable: true, description: an insight from preview, stored as is}
        confirm_duplicate: {type: boolean, description: 'send anyway after a 409 DUPLICATE_NEARBY'}
        generate_ai: {type: boolean, nullable: true, description: 'true = make AI after saving; false = never; missing = server switch'}
    SiteUpsertResult:
      type: object
      properties:
        site: {$ref: '#/components/schemas/Site'}
        context: {$ref: '#/components/schemas/SiteContext'}
        attachments:
          type: array
          items:
            type: object
            properties:
              site_attachment_id: {type: integer}
              file_name: {type: string}
              path: {type: string}
              created_at: {$ref: '#/components/schemas/WibTime'}
        task: {$ref: '#/components/schemas/TaskDetail'}
    SiteContextInput:
      type: object
      description: The whole survey at once; replaces fields and both lists.
      properties:
        foot_traffic_observation: {type: string, description: orang lewat per hari}
        peak_hours: {type: string, description: jam ramai}
        parking_availability: {type: string, enum: [AVAILABLE, LIMITED, NONE, ''], description: '"" = not filled'}
        public_transport: {type: string}
        anchor_landmark: {type: string}
        observed_demographics: {type: string, description: penduduk sekitar}
        competitors:
          type: array
          items:
            type: object
            required: [competitor_name]
            properties:
              competitor_name: {type: string}
              competitor_type: {type: string}
              distance: {type: string, example: 150 m}
        custom_notes:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}
              content: {type: string}
        vehicle_traffic_level: {type: string, enum: [QUIET, MODERATE, BUSY, VERY_BUSY, ''], description: 'Sepi / Sedang / Ramai / Sangat ramai; optional'}
        vehicle_traffic_count: {type: integer, minimum: 0, maximum: 99999, nullable: true, description: vehicles counted; needs vehicle_traffic_minutes}
        vehicle_traffic_minutes: {type: integer, minimum: 1, maximum: 120, nullable: true}
        vehicle_traffic_note: {type: string, maxLength: 300}
        parking_note: {type: string, maxLength: 300}
        competitor_note: {type: string, maxLength: 500}
    SiteContext:
      type: object
      properties:
        site_id: {type: string}
        foot_traffic_observation: {type: string}
        peak_hours: {type: string}
        parking_availability: {type: string}
        public_transport: {type: string}
        anchor_landmark: {type: string}
        observed_demographics: {type: string}
        competitors:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              competitor_name: {type: string}
              competitor_type: {type: string}
              distance: {type: string}
        custom_notes:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              title: {type: string}
              content: {type: string}
        created_at: {$ref: '#/components/schemas/WibTime'}
        updated_at: {$ref: '#/components/schemas/WibTime'}
        vehicle_traffic_level: {type: string, description: left out when empty}
        vehicle_traffic_count: {type: integer, description: left out when empty}
        vehicle_traffic_minutes: {type: integer, description: left out when empty}
        vehicle_traffic_note: {type: string, description: left out when empty}
        parking_note: {type: string, description: left out when empty}
        competitor_note: {type: string, description: left out when empty}
    CancelInput:
      type: object
      properties:
        notes: {type: string, maxLength: 500, description: optional reason}
    DecisionInput:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT, REVISION, HOLD, RELEASE]}
        notes: {type: string, maxLength: 500, description: 'catatan; required only for HOLD (alasan)'}
    PendingApproval:
      type: object
      properties:
        approval_detail_id: {type: integer}
        task_id: {type: string}
        site_id: {type: string}
        site_name_1: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_address_3: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        created_by: {type: integer, format: int64}
        created_by_name: {type: string}
        level: {type: integer}
        submitted_at: {$ref: '#/components/schemas/WibTime'}
        created_at: {$ref: '#/components/schemas/WibTime'}
        submit_count: {type: integer, description: '> 1 = "Pernah dikirim sebelumnya"'}
    ApprovalHistoryRow:
      type: object
      properties:
        approval_detail_id: {type: integer}
        task_id: {type: string}
        site_id: {type: string}
        site_name_1: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_address_3: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        created_by: {type: integer, format: int64}
        created_by_name: {type: string}
        level: {type: integer}
        status: {type: string, enum: [APPROVED, REJECTED, REVISION, HOLD]}
        notes: {type: string}
        acted_at: {allOf: [{$ref: '#/components/schemas/WibTime'}], nullable: true}
        created_at: {$ref: '#/components/schemas/WibTime'}
        rejected_by_role: {type: string}
    NearbyRequest:
      type: object
      properties:
        site_id: {type: string}
        site_name: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        owner_id: {type: integer, format: int64}
        owner_name: {type: string}
        lat: {type: number}
        lng: {type: number}
        distance_m: {type: integer}
    UserProfile:
      type: object
      properties:
        user_id: {type: integer, format: int64}
        nik: {type: string}
        username: {type: string}
        role: {type: string, enum: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]}
    AIMetric:
      type: object
      properties:
        label: {type: string}
        score: {type: integer, minimum: 0, maximum: 100}
        band: {type: string}
        summary: {type: string}
        factors: {type: array, items: {type: string}}
    AIInsight:
      type: object
      description: Gemini's location score. JSON names in camelCase (as site-dev-api).
      properties:
        site_ai_id: {type: integer, format: int64}
        site_id: {type: string}
        overallScore:
          type: integer
          description: |
            (27 Okt) Computed by the server from ALL inputs, not taken from Gemini:
            clamp(round(0.18 x the 5 main metrics + 0.10 x vehicleTraffic) - risk penalty + opportunity bonus, 0, 100).
            The 6 metrics carry the survey (parking, notes, competitor note, map data); risk penalty = high 4 /
            moderate 2 / low 1 per risk, max 10; opportunity bonus = +1 per concrete opportunity backed by the
            survey or map data, 0-5. Insights made before 27 Oct keep Gemini's number.
        recommendation: {type: string, description: 'from overallScore: >=82 Strongly Recommended, 70-81 Recommended, 55-69 Proceed With Caution, <55 Reconsider'}
        headline: {type: string}
        narrative: {type: string}
        metrics:
          type: object
          properties:
            footTraffic: {$ref: '#/components/schemas/AIMetric'}
            demographics: {$ref: '#/components/schemas/AIMetric'}
            competition: {$ref: '#/components/schemas/AIMetric'}
            accessibility: {$ref: '#/components/schemas/AIMetric'}
            economic: {$ref: '#/components/schemas/AIMetric'}
            vehicleTraffic: {allOf: [{$ref: '#/components/schemas/AIMetric'}], description: Lalu Lintas Kendaraan; left out on old insights}
        competitors:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              distanceKm: {type: number}
              type: {type: string}
        risks:
          type: array
          items:
            type: object
            properties:
              title: {type: string}
              severity: {type: string}
              mitigation: {type: string}
        opportunities: {type: array, items: {type: string}}
        confidenceLevel: {type: string}
        confidenceReason: {type: string}
        dataAssumptions: {type: array, items: {type: string}}
        contextWarnings:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              userClaim: {type: string}
              aiExpectation: {type: string}
              severity: {type: string}
              message: {type: string}
        generatedAt: {$ref: '#/components/schemas/WibTime'}
        data_source: {type: string, enum: [gemini, gemini+google, gemini+osm, gemini+mixed], description: 'map data the AI got; only on a fresh answer while [places] is on'}
        measured: {type: object, description: 'the map data given to Gemini (counts, examples, nearest FamilyMart); only on a fresh answer'}
        score_reason: {type: string, description: '(baru, 27 Okt) why this score: 2-4 Indonesian sentences naming the biggest plus and minus. Show it under the big score. Left out on older insights.', example: 'Nilai terbantu oleh akses yang baik dan banyak kantor tercatat dalam 500 m. Nilai tertahan oleh parkir yang terbatas dan 4 minimarket pesaing dalam 300 m.'}
        score_breakdown:
          type: object
          description: (baru, 27 Okt) how overallScore was computed; left out on older insights
          properties:
            base: {type: integer, description: round(0.18 x 5 main metrics + 0.10 x vehicleTraffic)}
            risk_penalty: {type: integer, description: 'high 4 / moderate 2 / low 1 per risk, max 10'}
            opportunity_bonus: {type: integer, description: '0-5'}
          example: {base: 75, risk_penalty: 2, opportunity_bonus: 1}
        input_hash: {type: string, description: '(baru, 27 Okt) fingerprint (sha256 hex) of the inputs this result was made from; send it back inside `insight` on save. Left out on older insights.'}
    AIQuota:
      type: object
      properties:
        limit: {type: integer, description: my analyses per day}
        remaining: {type: integer}
        site: {$ref: '#/components/schemas/LimitCount'}
        server_today: {$ref: '#/components/schemas/LimitCount'}
    LimitCount:
      type: object
      description: present only while that limit is on
      properties:
        limit: {type: integer}
        used: {type: integer}
        remaining: {type: integer}
    MapPoint:
      type: object
      properties:
        store_code: {type: string}
        store_name: {type: string}
        store_type_name: {type: string}
        site_type: {type: string, description: '"Site Active" (store) or "Site Requested"'}
        longitude: {type: number}
        latitude: {type: number}
        opening_store_dt: {type: string, nullable: true}
        task_status: {type: string, description: requested sites only}
    FamilyMartStores:
      type: object
      properties:
        lat: {type: number}
        lng: {type: number}
        radius_m: {type: integer}
        count: {type: integer, description: number of stores in `stores`}
        capped: {type: boolean, description: 'more stores were inside the radius than max_results (200); the farthest are left out'}
        cached: {type: boolean, description: rows from the server cache (1 hour)}
        stores:
          type: array
          items:
            type: object
            properties:
              store_code: {type: string, example: UJI020}
              store_name: {type: string, example: FM Uji Setiabudi}
              address: {type: string, description: '"" when the store database has none'}
              lat: {type: number}
              lng: {type: number}
              distance_m: {type: integer, description: straight-line metres from lat/lng}
    NearbyArea:
      type: object
      properties:
        source: {type: string, enum: [google, osm, mixed]}
        lat: {type: number}
        lng: {type: number}
        radius_m: {type: integer}
        fetched_at: {type: string, format: date-time}
        places:
          type: array
          items:
            type: object
            properties:
              id: {type: string, description: 'g:<place_id> or o:<type>/<id>'}
              name: {type: string}
              category: {type: string, enum: [competitor, office, school, university, apartment, other_store], description: '`other_store` only with `include=other_store`'}
              brand: {type: string, description: competitors only, e.g. indomaret}
              lat: {type: number}
              lng: {type: number}
              distance_m: {type: integer}
              source: {type: string}
              place_id: {type: string}
              address: {type: string, description: '(baru, 29 Okt) Short street address when the source has one (Google shortFormattedAddress, OSM addr:* tags); left out otherwise. Areas cached before 29 Okt have none until they expire (Google 7 days, OSM 6 h).'}
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              count: {type: integer}
              source: {type: string}
              capped: {type: boolean, description: 'the source cut the list; real number may be higher'}
              complete_within_m: {type: integer}
        google_calls: {type: integer, description: Google calls made for this answer (0 when cached)}
        cached: {type: boolean}
        fallback_reason: {type: string}
        nearest_familymart:
          type: object
          nullable: true
          properties:
            name: {type: string}
            code: {type: string}
            distance_m: {type: integer}
            within_1km: {type: integer}
        store_source: {type: string, example: real}
        attribution: {type: string}
    ActivityRow:
      type: object
      properties:
        id: {type: integer}
        task_id: {type: string}
        site_id: {type: string}
        site_name_1: {type: string}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        action: {type: string, enum: [SUBMIT, RESUBMIT, APPROVE, REVISION, HOLD, RELEASE, REJECT, CANCEL]}
        actor_id: {type: integer, format: int64}
        actor_name: {type: string}
        actor_role: {type: string}
        created_at: {$ref: '#/components/schemas/WibTime'}
        round: {type: integer}
        needs_action: {type: boolean}
        unread: {type: boolean}
        notice: {type: string, enum: [DIV_HEAD_RETURNED], description: 'Dept Head only ("Untuk Anda"); left out otherwise'}
    SiteAds:
      type: object
      properties:
        ads_value: {type: integer, format: int64, nullable: true, description: Rupiah per day}
        ads_note: {type: string}
        updated_by_name: {type: string}
        updated_at: {allOf: [{$ref: '#/components/schemas/WibTime'}], nullable: true}
    PortalRow:
      type: object
      properties:
        site_id: {type: string}
        task_id: {type: string}
        site_name_1: {type: string}
        site_address_1: {type: string}
        site_address_2: {type: string}
        site_district: {type: string}
        site_city: {type: string}
        site_region: {type: string}
        site_postal_code: {type: string}
        site_lat: {type: number}
        site_lon: {type: number}
        task_status: {$ref: '#/components/schemas/TaskStatus'}
        status_group: {type: string, enum: [WAITING_DEPT_HEAD, WAITING_DIV_HEAD, HOLD, APPROVED, REJECTED]}
        hold_note: {type: string, description: HOLD only}
        created_by: {type: integer, format: int64}
        created_by_name: {type: string}
        created_by_nik: {type: string}
        submitted_at: {allOf: [{$ref: '#/components/schemas/WibTime'}], nullable: true}
        updated_at: {$ref: '#/components/schemas/WibTime'}
        ads: {allOf: [{$ref: '#/components/schemas/SiteAds'}], nullable: true}
    PortalReport:
      type: object
      properties:
        site:
          allOf:
            - $ref: '#/components/schemas/Site'
            - type: object
