  /v1/site/active-list:
    get:
      tags: [Map / Places]
      summary: Active FamilyMart stores table (Site Active) (not used by the mobile app)
      description: Roles - all. 20 rows per page; `q` matches store code or name.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: siteActiveList
      x-mobile-app: "not used (other systems): full prototype's Peta / store list page; old web app"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
