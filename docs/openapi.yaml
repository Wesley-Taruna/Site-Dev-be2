        '403': {$ref: '#/components/responses/NoToken'}
        '422':
          description: Not a number, unknown attachment, or file missing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {attachment: The attachment is not found}}

