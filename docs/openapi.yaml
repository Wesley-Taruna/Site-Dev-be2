        insight: {allOf: [{$ref: '#/components/schemas/AIInsight'}], nullable: true}
        staff_note: {type: string}
        ads: {allOf: [{$ref: '#/components/schemas/SiteAds'}], nullable: true}
        status_group: {type: string, nullable: true}
    CompetitorBrand:
      type: object
      properties:
        slug: {type: string, example: indomaret}
