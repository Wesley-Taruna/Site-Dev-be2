  /v1/site/nearby-places:
    get:
      tags: [Map / Places]
      summary: Competitors and offices around a point (Pilih titik)
      description: |
        Roles - all. Google Places first (server key), OpenStreetMap when Google refuses, fails, is over its
        daily cap or has no key; `source` says which. Cached per ~110 m cell (Google 7 days, OSM 6 h).
        A new area = 9 Google calls today. Server switch `[places] enabled` off = 503.

        **Other convenience stores (baru, 29 Okt).** `include=other_store` adds the minimarkets / convenience
        stores that are NOT one of the active competitor brands, as `category: other_store` (no `brand`), so the
        Site division can spot new competitors. They come from the competitor search the server already makes
        (Google `convenience_store` Nearby Search, or OpenStreetMap `shop=convenience`/`minimarket`): **no extra
        Google call**. `categories.other_store` gives the count; `capped` / `complete_within_m` follow the
        competitor search (Google returns at most 20 convenience stores per area). Only when the server switch
        `[places] other_stores = true`; otherwise, and without `include`, the answer is exactly as before.
        Each item may carry `address` (baru, 29 Okt; same Places price tier, no extra call).
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: siteNearbyPlaces
      x-mobile-app: "used: map layers Kompetitor + Kantor + Minimarket lain (include=other_store) around the pin and on the detail map"
      parameters:
        - $ref: '#/components/parameters/LatRequired'
        - $ref: '#/components/parameters/LngRequired'
        - name: radius
          in: query
          description: Metres; 0 or missing = `[places] radius_m` (500); max `[places] max_radius_m` (1000).
          schema: {type: integer, minimum: 0}
        - name: include
          in: query
          description: (baru, 29 Okt) Extra groups, comma-separated. `other_store` = convenience stores of no listed brand (see above). Unknown values are ignored.
          schema: {type: string, example: other_store}
      responses:
        '200':
          description: Places
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/NearbyArea'}
        '400':
          description: Point outside Indonesia, or radius too big
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 400, status: failure, message: Bad Request, errors: {error: radius maksimal 1000 m}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadLatLng'}
        '502':
          description: Google failed and OpenStreetMap could not be reached
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 502, status: failure, message: Bad Gateway, errors: {error: Data peta (OpenStreetMap) tidak bisa diambil sekarang. Coba lagi sebentar lagi.}}
        '503':
          description: Switched off on this server
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 503, status: failure, message: Service Unavailable, errors: {error: 'Data sekitar titik belum diaktifkan di server ini ([places] enabled = false).'}}
  /v1/site/familymart-stores:
    get:
      tags: [Map / Places]
      summary: FamilyMart stores within 1 km of a point (map)
      description: |
        **Baru, 29 Okt (Wes).** Roles - all. Every **active FamilyMart store within 1 km** of `lat`/`lng`,
        **nearest first**, to draw them on the map: store code, name, address, lat, lng and distance in metres.
        From the FamilyMart store database (server config `[store_database]`; by default the same table
        `/v1/site/maps` reads, `AMFIBI_MASTER.dbo.MStore`). No Google call, no cost.

        - `radius` (metres) is optional: default and maximum 1000 (`[familymart_stores] radius_m` / `max_radius_m`).
        - At most 200 stores (`max_results`); `capped: true` = more were inside, the farthest are left out.
        - `address` is `""` when the store database has no address for the store (or the server has no
          `address_column` set yet).
        - Same ~110 m area = rows from the server cache for 1 hour (`cached: true`); a new or closed store
          shows up after at most that long.
        - Empty area = `count: 0`, `stores: []` (never null).
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: siteFamilyMartStores
      x-mobile-app: "used: FamilyMart layer on the map (Pilih titik, detail / Konfirmasi Data map card), call with the pin or the user's location"
      parameters:
        - $ref: '#/components/parameters/LatRequired'
        - $ref: '#/components/parameters/LngRequired'
        - name: radius
          in: query
          description: Metres; 0 or missing = 1000; max 1000 (`[familymart_stores] max_radius_m`).
          schema: {type: integer, minimum: 0, maximum: 1000, example: 1000}
      responses:
        '200':
          description: Stores, nearest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/FamilyMartStores'}
              example:
                code: 200
                status: success
                data:
                  lat: -6.216
                  lng: 106.83
                  radius_m: 1000
                  count: 2
                  capped: false
                  cached: false
                  stores:
                    - {store_code: UJI020, store_name: FM Uji Setiabudi, address: 'Jl. Setiabudi Raya No. 9, Setiabudi, Jakarta Selatan', lat: -6.209, lng: 106.8298, distance_m: 779}
                    - {store_code: UJI003, store_name: FM Uji Kuningan, address: '', lat: -6.2241, lng: 106.8314, distance_m: 914}
        '400':
          description: Point outside Indonesia, or radius too big
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 400, status: failure, message: Bad Request, errors: {error: radius maksimal 1000 m}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadLatLng'}
        '503':
          description: Store database not set up correctly or not reachable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 503, status: failure, message: Service Unavailable, errors: {error: Data toko FamilyMart tidak bisa dibaca sekarang. Coba lagi sebentar lagi.}}
  /v1/site/{id}/context:
    get:
      tags: [Map / Places]
      summary: The on-site survey of a site (not used by the mobile app)
      description: Roles - all. `id` = site_id. No survey yet = 500 `record not found` (old behaviour).
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: siteContext
      x-mobile-app: "not used (other systems): old web app; the detail already holds the survey"
      parameters:
        - $ref: '#/components/parameters/SiteIdInPathAsId'
      responses:
        '200':
          description: Survey
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/SiteContext'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '500': {$ref: '#/components/responses/RecordNotFound'}
  /v1/geocoding/reverse:
    get:
      tags: [Map / Places]
      summary: Address of a map point (pin address)
      description: |
        Roles - all. Google Geocoding in the backend; per-user daily quota (`[geocoding] daily_quota`, admin can
        change it) and server-wide daily cap. `district`/`city`/`region` are not in this answer: look them up
        with `GET /v1/wilayah/search?postal_code=`.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: geocodingReverse
      x-mobile-app: "used: address of the pin (Pilih titik, location card when the street is empty)"
      parameters:
        - $ref: '#/components/parameters/LatRequired'
        - $ref: '#/components/parameters/LngRequired'
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          address1: {type: string, example: 'Jl. Kemang Raya No.10, Bangka'}
                          address2: {type: string, example: 'Kecamatan Mampang Prapatan, Kota Jakarta Selatan'}
                          address3: {type: string, example: Daerah Khusus Ibukota Jakarta}
                          postal_code: {type: string, example: '12730'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadLatLng'}
        '429': {$ref: '#/components/responses/GeocodingLimit'}
        '503': {$ref: '#/components/responses/GeocodingOff'}
  /v1/geocoding/search:
    get:
      tags: [Map / Places]
      summary: Address search by text (Peta search box) (not used by the mobile app)
      description: Roles - all. `q` at least 3 characters; empty `q` = empty list. Same quota as reverse.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: geocodingSearch
      x-mobile-app: "not used (other systems): full prototype's Peta search box; simple has no typed address search"
      parameters:
        - name: q
          in: query
          schema: {type: string, minLength: 3, example: Jalan Senopati Jakarta}
      responses:
        '200':
          description: Hits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            lat: {type: number}
                            lng: {type: number}
                            display_name: {type: string}
                            address1: {type: string}
                            address2: {type: string}
                            address3: {type: string}
                            postal_code: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422':
          description: q shorter than 3
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {q (minimal 3 karakter): The q (minimal 3 karakter) is invalid value.}}
        '429': {$ref: '#/components/responses/GeocodingLimit'}
        '503': {$ref: '#/components/responses/GeocodingOff'}

  # ------------------------------------------------------------------ Activity Log
  /v1/activity:
    get:
      tags: [Activity Log]
      summary: Activity Log rows
      description: |
        Roles - USER, DEPT_HEAD, DIV_HEAD (ADMIN gets an empty list).
        Staff: every move on their own requests. Heads: every move by anyone on all requests sent at least once.
        No note/reason on any row (it is in the request's Riwayat). Page size `limit` (default 20, max 100).
      x-roles: [USER, DEPT_HEAD, DIV_HEAD]
      operationId: activityList
      x-mobile-app: "used: Activity Log (Semua / Perlu tindakan / Dari Approval or Keputusan saya)"
      parameters:
        - name: filter
          in: query
          description: |
            `all` (Semua, default); `action` (Perlu tindakan: staff = returned to me, heads = waiting/held at my level);
            `mine` (staff: the approvers' moves on my requests; heads: my own decisions = Keputusan saya).
          schema: {type: string, enum: [all, action, mine], default: all}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Rows, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/ActivityRow'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/activity/unread-count:
    get:
      tags: [Activity Log]
      summary: Unread Activity Log rows (red badge)
      description: Roles - USER, DEPT_HEAD, DIV_HEAD (ADMIN gets 0). Rows newer than the last `POST /v1/activity/seen`; never opened = last 3 days.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD]
      operationId: activityUnreadCount
      x-mobile-app: "used: red badge on the Activity Log tab"
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          count: {type: integer, example: 3}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/activity/seen:
    post:
      tags: [Activity Log]
      summary: Mark the Activity Log as seen up to now
      description: Roles - all. No body; the answer has no data.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: activitySeen
      x-mobile-app: "used: opening the Activity Log clears the badge"
      responses:
        '200': {$ref: '#/components/responses/OkNoData'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}

