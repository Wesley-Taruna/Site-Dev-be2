      summary: Upload one photo (before saving the request)
      description: |
        Roles - all. Multipart field `file`. Answer = the stored name and its `<bucket>/<object>` path; put both
        into `attachment` of `POST /v1/task/{status}`. **Note:** the file-storage connection is still a TODO in
        the main build (plan Q4): until it is set up this answers 500 "not set up yet".
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: uploadAdd
      x-mobile-app: "used: add a photo in the form"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          file_name: {type: string, example: 20261027-abc123-depan.jpg}
                          path: {type: string, example: sitedev-temp/temp/20261027-abc123-depan.jpg}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422':
          description: No `file` field
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {file: The file is invalid value.}}
        '500': {$ref: '#/components/responses/ServerError'}
  /v1/upload/remove:
    post:
      tags: [Files]
      summary: Remove an uploaded photo
      description: Roles - all. The answer has no data.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: uploadRemove
      x-mobile-app: "used: remove a photo in the form"
      requestBody:
        required: true
        content:
          application/json:
            schema:
