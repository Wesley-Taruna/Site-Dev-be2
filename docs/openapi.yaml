      responses:
        '200': {$ref: '#/components/responses/OkNoData'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422':
          description: path missing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {path: The path field is required.}}
        '500': {$ref: '#/components/responses/ServerError'}
