openapi: 3.0.3
info:
  title: Site Dev API (site-dev-backend)
  version: 0.1.0-dev
  description: |
    REST API of **Site Development** (site survey, Gemini AI location score, approval
    chain Dept Head -> Div Head) for the Familink mobile app and the FamilyMart web portal.

    **Mobile app = the simple version (Wes, 28 Okt).** The Familink FE team builds the screens of
    https://site-dev-simple.vercel.app. It needs **24 of the 69 operations** here (+2 maybe: the token
    check `POST /v1/validation`, depending on how Familink logs users in, and `GET /v1/competitor-brands`).
    Every operation carries `x-mobile-app` (which screen uses it, or who else does); the summary of the
    ones the app does not use ends with "(not used by the mobile app)". Nothing was removed: the web
    portal, admin screens, background jobs and old web app still use the rest.
    Staff Home tiles: use `GET /v1/task/status/count` (own requests), not the dashboard count (everyone's).
    Written from the code (handlers, DTOs, validation) of `site-dev-backend`; a Go test
    (`internal/app/router/openapi_routes_test.go`) fails when a route is added or removed
    without updating this file.

    **Login (Bearer token).** Every route except the health check, `POST /v1/validation/approval`,
    the background-job callbacks (Basic auth) and the boilerplate sample needs
    `Authorization: Bearer <JWT>`. The token is HS256, signed with the server's `[jwt] key`, claims
    `user_id` (number = NIK, must exist in `Users`), `expire_at` (Unix seconds), optional
    `permissions`, `timezone`. **The role is read from the `Users` table, not from the token.**
    Who issues real tokens for Familink is still open (plan Q1b); on dev, test tokens per role.
    - no `Authorization` header: **403** `Forbidden`
    - bad or wrongly signed token: **401** `Unauthorized`
    - token past `expire_at`: **401** `Your token is expired`
    - token fine but `user_id` not in `Users`: **401** `user not found`

    **Answer envelope (familabs).** Every JSON answer is
    `{code, status, message, data, errors, total, page, per_page}`; empty fields are left out.
    - success: `{"code":200,"status":"success","data":...}`
    - list: adds `total`, `page`, `per_page` (only when `total` > 0)
    - error: `{"code":4xx/5xx,"status":"failure","message":"<HTTP text>","errors":{"error":"<text>"}}`;
      the text in `errors.error` is often Indonesian and meant for the user.
    - validation error: **422** `{"errors":{"<field>":"<message>"}}`

    **Pages.** Lists return **20 rows per page** by default (`?page=1,2,...`). These lists take
    `limit` (or `per_page`), default 20, max 100: `GET /v1/task`, `/v1/task/pending-approvals`,
    `/v1/task/approval-history` (baru, 28 Okt), Activity Log, Portal. The other older lists ignore
    `per_page`/`limit` (always 20). Always send `limit` or `per_page`: the envelope's `page`/`per_page`
    are only right when one is sent (without it the server answers `page: 1, per_page: <total>`, as
    site-dev-api did).

    **Times (WIB).** The server runs with `TZ=Asia/Jakarta` and the database holds WIB wall-clock time.
    Timestamps come out as RFC 3339 with a `Z` at the end (as the old site-dev-api did), but the
    digits are **WIB**: show them as they are, do **not** add 7 hours. Values the server has just
    written in the same call (e.g. `site.created_at` in the save answer, `fetched_at`) carry `+07:00`
    instead: same clock time. Dates without time are `YYYY-MM-DD` (`""` when empty).
    Rows filled by a database default (seed data) carry the database server's own clock (checked
    locally: UTC); the DB owner confirms the real server's time zone.

    **Status values (exact, keep the spelling).** Stored on a request (`task_status`): `DRAFT`,
    `WAITING_DEPT_HEAD`, `WAITING_DIV_HEAD`, `HOLD_DEPT_HEAD`, `HOLD_DIV_HEAD`, `REVISION`
    ("Ditolak, bisa direvisi"), `REJECTED` ("Ditolak final"), `COMPLETED` (approved by the last level),
    `CANCELLED` ("Dibatalkan"). `SUBMITED` (sic) is only the *send* action in `POST /v1/task/SUBMITED`.
    `APPROVED` is never written on a request by this backend (old site-dev-api data might have it, so
    the list filter `status=COMPLETED` matches it too); it is also a portal group name.

    **Roles** (`Users.RoleID`): `USER` (site staff, "Staf"), `DEPT_HEAD`, `DIV_HEAD`, `ADMIN`.
    Each operation lists who may call it in its description and in `x-roles`.

    **Errors kept from site-dev-api.** Most older endpoints answer an unknown id with **500**
    `record not found` (not 404); only the new endpoints use 404. Unknown attachment = 422.

    **Site ID (baru, 28 Okt, final).** New requests get `site_id` = `SD` + `ddmmyyyy` (WIB) + a running
    number of that day, at least 3 digits: `SD28102026001` (the 1000th of a day: `SD281020261000`).
    This is the "No." users see; it is URL-safe as is. Requests made before keep their ID: `ST` +
    `yyyymmdd` + 6 digits (`ST20261027000001`), or the slashed form of 27 Oct (`SD27/10/2026001`, local
    test data only). All of them work everywhere. `task_id` (`TS…`) is unchanged.
    **A slashed ID in a URL path:** send the twin (every `/` → `-`, `/v1/task/SD27-10-2026001`) or
    `%2F`; in JSON it stays `SD27/10/2026001`. Query parameters (`?site_id=`) take any form.

    Marked **(baru, 26 Okt)**: added by Wes's 26 Oct changes (optional notes on Tolak, Batalkan
    pengajuan, Hapus draft).
  contact:
    name: Site Dev (Wes, FamilyMart Indonesia)
servers:
  - url: /
    description: this server
tags:
  - name: Task / Pengajuan
    description: Site requests ("Pengajuan") of the site staff - save, send, list, detail, cancel, delete draft.
  - name: Approval
    description: Dept Head / Div Head decisions ("Persetujuan") and the e-mail approval link.
  - name: AI Insight
    description: Gemini location score ("Analisis AI"). Called only by this backend; the app never holds the Gemini key. Limits answer 429.
  - name: Map / Places
    description: Sites, map points, active FamilyMart stores, competitors and offices near a point, address from a pin.
  - name: Activity Log
    description: Activity Log feed of staff, Dept Head and Div Head.
  - name: Notifications
    description: Approver "Baru" news (new requests in the Persetujuan tab).
  - name: Portal
    description: Site Dev menu of the FamilyMart web portal (office users, not site staff).
  - name: Competitor brands
    description: The competitor brand list (logos, colours, name patterns).
  - name: Master data
    description: Wilayah (province, regency, district, village, postal code) and dashboard counts.
  - name: Files
    description: Photo upload / remove and attachment download.
  - name: Admin
    description: Users, roles, approval matrix, AI and geocoding limits. ADMIN only.
  - name: Login / token
    description: Token check.
  - name: Background jobs
    description: Callbacks of the background-job service (Cloud Tasks). Basic auth `[public_api]`, not for apps.
  - name: Health
    description: Health check and this documentation.
  - name: Boilerplate sample
    description: Sample routes of the FamilyMart Go template (`person`). Not used by Site Dev, no login, no table behind them; removal is plan question Q6.

paths:
  # ------------------------------------------------------------------ Task / Pengajuan
  /v1/task:
    get:
      tags: [Task / Pengajuan]
      summary: List of requests (Pengajuan)
      description: |
        Roles: all. `USER` sees only the requests they created; heads and ADMIN see all.
        `limit` (or `per_page`) rows per page, default 20, max 100 (baru, 28 Okt; before, always 20).
        Without `sort_by`/`sort_dir` the order is oldest first (`CreatedAt ASC`, as site-dev-api); send
        `sort_by=CreatedAt&sort_dir=desc` for newest first.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskList
      x-mobile-app: "used: Pengajuan saya; Persetujuan > Pengajuan (chips Semua, Menunggu, Hold Status, Revisi, Ditolak Final, Disetujui, ...)"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PerPageSized'
        - name: status
          in: query
          description: |
            One stored status (e.g. `WAITING_DEPT_HEAD`), or a group: `HOLD` = both `HOLD_*`;
            `WAITING` = `WAITING_DEPT_HEAD` + `WAITING_DIV_HEAD` (+ `SUBMITED`, if ever stored) ("Menunggu", simple app);
            `COMPLETED` = `COMPLETED` + `APPROVED` ("Disetujui"; `APPROVED` only in old site-dev-api data);
            `REJECTED_ANY` = `REVISION` + `REJECTED` ("Ditolak").
          schema: {type: string, example: WAITING_DEPT_HEAD}
        - name: status_not
          in: query
          description: Comma-separated statuses to leave out, used only when `status` is empty. The staff app's active list uses `REJECTED,CANCELLED`; the heads' Semua tab `DRAFT`.
          schema: {type: string, example: 'REJECTED,CANCELLED'}
        - name: site_id
          in: query
          schema: {type: string, example: SD28102026001}
        - $ref: '#/components/parameters/Q'
        - name: sort_by
          in: query
          schema: {type: string, enum: [CreatedAt, TaskStatus], default: CreatedAt}
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/TaskRow'}}
              example:
                code: 200
                status: success
                data:
                  - task_id: TS20261027000001
                    site_id: SD28102026001
                    site_name_1: Uji Kemang Raya
                    site_address_1: Jl. Kemang Raya No. 10, Bangka
                    site_address_2: Kecamatan Mampang Prapatan, Kota Jakarta Selatan
                    site_address_3: DKI Jakarta
                    task_status: WAITING_DEPT_HEAD
                    created_by: 90000101
                    updated_by: 90000101
                    created_at: '2026-10-27T09:15:00Z'
                    updated_at: '2026-10-27T09:20:00Z'
                    submit_count: 1
                total: 1
                page: 1
                per_page: 20
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadPage'}
  /v1/task/site-list:
    get:
      tags: [Task / Pengajuan]
      summary: Site Request table (every request except APPROVED) (not used by the mobile app)
      description: Roles - all; every role sees every request (old web app's "Site Request" table). 20 rows per page.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskSiteList
      x-mobile-app: "not used (other systems): old web app's Site Request table"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Q'
        - name: sort_by
          in: query
          schema: {type: string, enum: [CreatedAt, TaskStatus], default: CreatedAt}
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/TaskRow'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/task/status/count:
    get:
      tags: [Task / Pengajuan]
      summary: Requests per status (Home counts)
      description: Roles - all. `USER` counts only their own requests. Statuses with 0 are not listed.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskStatusCount
      x-mobile-app: "used: chip numbers + Home tiles (staff: own requests only)"
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/StatusCount'}}
              example:
                code: 200
                status: success
                data:
                  - {task_status: DRAFT, count: 2}
                  - {task_status: WAITING_DEPT_HEAD, count: 1}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/task/nearby:
    get:
      tags: [Task / Pengajuan]
      summary: Other active requests near a point
      description: |
        Roles - all. Active requests of all staff around a point, nearest first (sent and not final:
        `WAITING_*`, `HOLD_*`, `REVISION`, `COMPLETED`; not `DRAFT`, `REJECTED`, `CANCELLED`).
        Only name, status, owner and distance; no phone numbers or survey of other staff.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskNearby
      x-mobile-app: "used: \"Pengajuan lain di sekitar\" notice in the form and on the map"
      parameters:
        - $ref: '#/components/parameters/LatRequired'
        - $ref: '#/components/parameters/LngRequired'
        - name: radius
          in: query
          description: Metres; 0 or missing = 500, max 2000.
          schema: {type: integer, minimum: 0, maximum: 2000, default: 500}
        - name: exclude_site_id
          in: query
          description: Leave this site out (the one being edited).
          schema: {type: string}
      responses:
        '200':
          description: Nearby requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/NearbyRequest'}}
        '400':
          description: Point outside Indonesia, or radius above 2000
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                outside: {value: {code: 400, status: failure, message: Bad Request, errors: {error: Koordinat tidak valid (harus di Indonesia).}}}
                radius: {value: {code: 400, status: failure, message: Bad Request, errors: {error: radius maksimal 2000 m}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadLatLng'}
  /v1/task/{id}:
    get:
      tags: [Task / Pengajuan]
      summary: Request detail (site, survey, approval chain, history, photos)
      description: |
        Roles - all; `USER` only their own requests (else 403). `id` = task_id (`TS...`) or site_id (`SD...` path twin, or old `ST...`).
        `context` is null when the survey was never filled.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskDetail
      x-mobile-app: "used: request detail (Info, Survei & AI, Riwayat), sent page, edit/revisi form"
      parameters:
        - $ref: '#/components/parameters/TaskOrSiteId'
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/TaskDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: No token, or a USER asking for someone else's request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 403, status: failure, message: Forbidden, errors: {error: Anda tidak punya akses ke task TS20261027000002}}
        '500': {$ref: '#/components/responses/RecordNotFound'}
  /v1/task/{id}/history:
    get:
      tags: [Task / Pengajuan]
      summary: History rows of a request (Riwayat), oldest first (not used by the mobile app)
      description: Roles - all. `id` = site_id.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskHistory
      x-mobile-app: "not used: not needed: the detail already holds the history"
      parameters:
        - $ref: '#/components/parameters/SiteIdInPathAsId'
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/TaskHistory'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '500': {$ref: '#/components/responses/RecordNotFound'}
  /v1/task/{id}/attachment:
    get:
      tags: [Task / Pengajuan]
      summary: Photos / attachments of a request (not used by the mobile app)
      description: Roles - all. `id` = site_id.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: taskAttachments
      x-mobile-app: "not used: not needed: the detail already holds the photos"
      parameters:
        - $ref: '#/components/parameters/SiteIdInPathAsId'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/TaskAttachment'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/task/context/{site_id}:
    put:
      tags: [Task / Pengajuan]
      summary: Replace the on-site survey (Konteks On-Site / Survei lapangan) (not used by the mobile app)
      description: |
        Roles - the creator of the site only, while the request is `DRAFT` or `REVISION`.
        Replaces all fields and both lists (competitors, custom notes).
      x-roles: [USER]
      operationId: taskContextUpdate
      x-mobile-app: "not used: not needed: the survey is saved with Simpan draft / Kirim"
      parameters:
        - $ref: '#/components/parameters/SiteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteContextInput'}
      responses:
        '200':
          description: Saved survey
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/SiteContext'}
        '400':
          description: Already sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 400, status: failure, message: Bad Request, errors: {error: 'Task sudah disubmit, konteks tidak bisa diedit lagi'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: No token, or not the creator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 403, status: failure, message: Forbidden, errors: {error: Hanya pembuat site Uji Kemang Raya yang bisa edit konteks}}
        '422': {$ref: '#/components/responses/SurveyValidation'}
        '500': {$ref: '#/components/responses/RecordNotFound'}
  /v1/task/{status}:
    post:
      tags: [Task / Pengajuan]
      summary: Save a request as draft, or send it (Simpan draft / Kirim)
      description: |
        Roles - `USER` (site staff); the creator for an existing site.
        `status` = `DRAFT` (save) or `SUBMITED` (send; sic). `site.site_id` empty = new site, filled = update.

        **To send (SUBMITED) only 3 things are needed** (Wes, 26 Oct): Nama site (`site_name_1`),
        a map point (`site_lat`/`site_lon` valid, not 0,0) and Sales Area (`site_sales_area` > 0).
        Missing ones answer **400** with the list in `data`. Everything else is optional.
        A draft needs only `site_name_1` (422 otherwise).

        **AI on save:** `generate_ai: true` = make an AI analysis after saving (limits apply in the job;
        the save itself never fails because of AI); `false` = never; missing = server switch
        `[ai_insight] auto_generate_on_save`. An `insight` made before by preview is stored as is.

        **Duplicate check** (only when `[nearby_request] duplicate_check = "confirm"`): other active requests
        within 200 m answer **409** with them in `data`; send again with `confirm_duplicate: true`.

        A request returned to the staff (`REVISION`) is sent again with `SUBMITED` (history `RESUBMIT`,
        `submit_count` + 1, approval restarts at level 1).
      x-roles: [USER]
      operationId: taskSave
      x-mobile-app: "used: Simpan draft / Kirim (form and quick send)"
      parameters:
        - name: status
          in: path
          required: true
          schema: {type: string, enum: [DRAFT, SUBMITED]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteUpsertInput'}
            examples:
              send-minimum:
                summary: Send with only the 3 needed fields, no AI
                value:
                  site: {site_id: '', site_name_1: Uji Kemang Raya, site_lat: -6.2615, site_lon: 106.8106, site_sales_area: 120}
                  generate_ai: false
              draft:
                summary: Save a draft with a survey
                value:
                  site: {site_id: '', site_name_1: Uji Kemang Raya, site_address_1: Jl. Kemang Raya No. 10, site_lat: -6.2615, site_lon: 106.8106, site_sales_area: 120, site_planned_opening_date: '2027-03-01'}
                  context:
                    foot_traffic_observation: Ramai sore hari
                    peak_hours: 17:00-20:00
                    parking_availability: LIMITED
                    vehicle_traffic_level: BUSY
                    vehicle_traffic_count: 120
                    vehicle_traffic_minutes: 10
                    competitors: [{competitor_name: Indomaret, competitor_type: Mini Market, distance: 150 m}]
                    custom_notes: []
                  attachment: [{file_name: depan.jpg, path: sitedev-temp/temp/20261027-abc123-depan.jpg}]
                  notes: ''
                  generate_ai: false
      responses:
        '200':
          description: Saved; answer = site, survey, photos and the full request detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/SiteUpsertResult'}
        '400':
          description: Send without the 3 needed fields; same site name; or the request was already sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                missing:
                  summary: Send is missing fields (data lists them)
                  value: {code: 400, status: failure, message: Bad Request, data: [site_location, site_sales_area], errors: {error: 'Belum bisa dikirim. Lengkapi dulu: Lokasi (titik di peta), Sales Area.'}}
                duplicate-name:
                  value: {code: 400, status: failure, message: Bad Request, errors: {error: Site with name Uji Kemang Raya already exists}}
                already-sent:
                  value: {code: 400, status: failure, message: Bad Request, errors: {error: Data site sudah disubmit tidak bisa diedit kembali}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: No token, or not the creator of this site
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 403, status: failure, message: Forbidden, errors: {error: Hanya pembuat site Uji Kemang Raya yang bisa submit}}
        '409':
          description: Other active requests close by (only with duplicate_check = confirm)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example:
                code: 409
                status: failure
                message: Conflict
                data: [{site_id: SD20102026004, site_name: Uji Kemang Dua, task_status: WAITING_DEPT_HEAD, owner_id: 90000102, owner_name: Uji Staf Dua, lat: -6.2616, lng: 106.8109, distance_m: 35}]
                errors: {error: 'DUPLICATE_NEARBY: sudah ada 1 pengajuan aktif dalam 200 m dari titik ini. Cek dulu, lalu kirim ulang dengan confirm_duplicate = true bila tetap ingin mengirim.'}
        '422':
          description: Body rules (name for a draft, notes length, survey fields) or a status other than DRAFT/SUBMITED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                name: {value: {code: 422, status: failure, message: Unprocessable Entity, errors: {site.site_name_1: The site name 1 field is required.}}}
                survey: {value: {code: 422, status: failure, message: Unprocessable Entity, errors: {context.vehicle_traffic_minutes: The vehicle traffic minutes field is required when vehicle traffic count is present.}}}
                notes: {value: {code: 422, status: failure, message: Unprocessable Entity, errors: {notes: The notes may not be greater than 500}}}
                bad-status: {value: {code: 422, status: failure, message: Unprocessable Entity, errors: {'status (must be DRAFT or SUBMITED)': The status (must be DRAFT or SUBMITED) is invalid value.}}}
  /v1/task/{id}/cancel:
    post:
      tags: [Task / Pengajuan]
      summary: (baru, 26 Okt) Cancel a returned request (Batalkan pengajuan) (not used by the mobile app)
      description: |
        Roles - the creator only. Only a request in `REVISION` ("Ditolak, bisa direvisi") can be cancelled;
        it becomes `CANCELLED` ("Dibatalkan"), stays with its history (action `CANCEL`), and drops out of the
        active lists and the duplicate check. `id` = task_id or site_id. Body optional.
      x-roles: [USER]
      operationId: taskCancel
      x-mobile-app: "not used: simple has no \"Batalkan pengajuan\" button (open question: CANCELLED)"
      parameters:
        - $ref: '#/components/parameters/TaskOrSiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelInput'}
            example: {notes: Lokasi sudah disewa pihak lain}
      responses:
        '200': {$ref: '#/components/responses/OkNoData'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: No token, or not the creator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 403, status: failure, message: Forbidden, errors: {error: Hanya pembuat pengajuan yang bisa membatalkannya.}}
        '404':
          description: Unknown request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 404, status: failure, message: Not Found, errors: {error: Pengajuan tidak ditemukan.}}
        '409':
          description: Not in REVISION (or changed meanwhile)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 409, status: failure, message: Conflict, errors: {error: Hanya pengajuan yang Ditolak (bisa direvisi) yang bisa dibatalkan.}}
        '422':
          description: Notes longer than 500 characters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {notes: Catatan maksimal 500 karakter.}}
  /v1/site/{id}:
    get:
      tags: [Map / Places]
      summary: One site (not used by the mobile app)
      description: Roles - all. `id` = site_id.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: siteDetail
      x-mobile-app: "not used (other systems): old web app; the detail already holds the site"
      parameters:
        - $ref: '#/components/parameters/SiteIdInPathAsId'
      responses:
        '200':
          description: Site
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/Site'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '500': {$ref: '#/components/responses/RecordNotFound'}
    delete:
      tags: [Task / Pengajuan]
      summary: (baru, 26 Okt) Delete a draft that was never sent (Hapus draft) (not used by the mobile app)
      description: |
        Roles - the creator only. Only a `DRAFT` that was never sent (no approval round, no SUBMIT/RESUBMIT
        in its history). Removes the site, survey, photos, AI result, history and request for good.
        The AI limits keep what the draft used. `id` = site_id or task_id.
      x-roles: [USER]
      operationId: siteDeleteDraft
      x-mobile-app: "not used: simple has no \"Hapus draft\" button"
      parameters:
        - $ref: '#/components/parameters/TaskOrSiteId'
      responses:
        '200': {$ref: '#/components/responses/OkNoData'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: No token, or not the creator
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 403, status: failure, message: Forbidden, errors: {error: Hanya pembuat draft yang bisa menghapusnya.}}
        '404':
          description: Unknown request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 404, status: failure, message: Not Found, errors: {error: Pengajuan tidak ditemukan.}}
        '409':
          description: Not a never-sent draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 409, status: failure, message: Conflict, errors: {error: Hanya draft yang belum pernah dikirim yang bisa dihapus.}}

  # ------------------------------------------------------------------ Approval
  /v1/task/pending-approvals:
    get:
      tags: [Approval]
      summary: Waiting for my decision (Persetujuan - Perlu tindakan)
      description: Roles - DEPT_HEAD, DIV_HEAD (any user who is the approver of a level; others get an empty list). `limit` (or `per_page`) rows per page, default 20, max 100 (baru, 28 Okt).
      x-roles: [DEPT_HEAD, DIV_HEAD]
      operationId: approvalPending
      x-mobile-app: "used: Home \"Task : Need Approval\" number; Persetujuan list (heads)"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PerPageSized'
        - $ref: '#/components/parameters/Q'
        - name: sort_by
          in: query
          schema: {type: string, enum: [CreatedAt, Level], default: CreatedAt}
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: Pending levels
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/PendingApproval'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/task/approval-history:
    get:
      tags: [Approval]
      summary: What I already decided (approve, reject, revision, hold)
      description: Roles - DEPT_HEAD, DIV_HEAD. `limit` (or `per_page`) rows per page, default 20, max 100 (baru, 28 Okt); newest decision first by default.
      x-roles: [DEPT_HEAD, DIV_HEAD]
      operationId: approvalHistory
      x-mobile-app: "used: Persetujuan > decisions already made (heads)"
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/PerPageSized'
        - $ref: '#/components/parameters/Q'
        - name: sort_by
          in: query
          schema: {type: string, enum: [ActedAt, CreatedAt, Level], default: ActedAt}
        - $ref: '#/components/parameters/SortDir'
      responses:
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListEnvelope'
                  - properties:
                      data: {type: array, items: {$ref: '#/components/schemas/ApprovalHistoryRow'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
  /v1/task/{id}/approve:
    post:
      tags: [Approval]
      summary: Decide on a request (Setujui / Tolak / Hold / Lanjutkan)
      description: |
        Roles - the approver of the current level (DEPT_HEAD at level 1, DIV_HEAD at level 2). `id` = task_id.
        | decision | UI word | effect |
        |---|---|---|
        | `APPROVE` | Setujui | next level, or `COMPLETED` after the last level |
        | `REJECT` | Tolak final | `REJECTED`, closed for good |
        | `REVISION` | Tolak, bisa direvisi | `REVISION`, back to the staff |
        | `HOLD` | Hold Status | `HOLD_<ROLE>`; `notes` (reason) **required** |
        | `RELEASE` | Lanjutkan | back to `WAITING_<ROLE>` |
        `notes` optional (max 500) except for HOLD (baru, 26 Okt: no longer required for REJECT / REVISION).
        A held level takes only `RELEASE`. The answer has no `data`.
      x-roles: [DEPT_HEAD, DIV_HEAD]
      operationId: approvalDecide
      x-mobile-app: "used: Setujui / Tolak (Revisi or Ditolak Final) / Hold Status / Lanjutkan"
      parameters:
        - name: id
          in: path
          required: true
          description: task_id
          schema: {type: string, example: TS20261027000001}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionInput'}
            examples:
              approve: {value: {decision: APPROVE, notes: ''}}
              hold: {value: {decision: HOLD, notes: Menunggu konfirmasi pemilik}}
              revision: {value: {decision: REVISION, notes: Foto tampak depan kurang jelas}}
      responses:
        '200': {$ref: '#/components/responses/OkNoData'}
        '400':
          description: HOLD/RELEASE in the wrong state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                held: {value: {code: 400, status: failure, message: Bad Request, errors: {error: Pengajuan ini sedang Anda tahan. Tekan Lanjutkan dulu.}}}
                not-held: {value: {code: 400, status: failure, message: Bad Request, errors: {error: Pengajuan ini tidak sedang dalam Hold Status.}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422':
          description: Unknown decision, HOLD without reason, notes too long
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              examples:
                hold-reason: {value: {code: 422, status: failure, message: Unprocessable Entity, errors: {notes: Alasan Hold Status wajib diisi.}}}
        '500':
          description: Unknown task, not waiting, or the caller is not the approver of the current level (old error, kept)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 500, status: failure, message: Internal Server Error, errors: {error: 'task_service: no pending approval for this user on task TS20261027000001: record not found'}}
  /v1/validation/approval:
    post:
      tags: [Approval]
      summary: Exchange an e-mail approval code for a token (no login needed) (not used by the mobile app)
      description: |
        Roles - anyone with the link. The approval e-mail links to the app with `?approval_code=<32 chars>`;
        this answers a token for the approver plus the site to open. The code must still be pending.
      x-roles: [public]
      operationId: approvalCodeLogin
      x-mobile-app: "not used (other systems): link in the approval e-mail (only if e-mails link into an app page; simple has none)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_code]
              properties:
                approval_code: {type: string, minLength: 32, maxLength: 32}
      responses:
        '200':
          description: Token, site, approver
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          jwt: {type: string}
                          site_id: {type: string}
                          user_profile: {$ref: '#/components/schemas/UserProfile'}
        '422':
          description: Missing code, or not 32 characters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {approval_code: The approval code must be 32 characters.}}
        '500':
          description: Code unknown, expired or no longer pending (old error, kept)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 500, status: failure, message: Internal Server Error, errors: {error: 'approval_validation: code is invalid or expired'}}

  # ------------------------------------------------------------------ AI Insight
  /v1/task/ai-insight:
    post:
      tags: [AI Insight]
      summary: Make a new AI analysis for a saved site (newest is shown; earlier ones kept) (not used by the mobile app)
      description: |
        Roles - all (the app shows it to staff). One Gemini call (~20-30 s). Counts against the limits:
        per staff per day, per site location (~110 m, all users, all rounds) and per day for everyone.
        Only answered calls count. AI off on this server = 503. Empty survey = 400 (baru, 27 Okt).
        Re-run (baru, 27 Okt): staff can make it again after "Tolak, bisa direvisi" or on a reopened draft. When the
        site's saved inputs are exactly those of its newest insight (`input_hash`) the answer is **409**
        "Data belum berubah sejak analisis terakhir." (no Gemini call, nothing counted). A new result is ADDED;
        earlier ones stay in the database as history; `GET /v1/task/ai-insight/{site_id}` returns the newest.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: aiGenerate
      x-mobile-app: "not used (other systems): AI on save when switched on in config (background job); simple uses preview"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id]
              properties:
                site_id: {type: string, example: SD28102026001}
      responses:
        '200':
          description: The new insight (stored)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/AIInsight'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/AIEmptyInputs'}
        '403': {$ref: '#/components/responses/NoToken'}
        '409': {$ref: '#/components/responses/AIUnchanged'}
        '422':
          description: site_id missing
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {site_id: The site id field is required.}}
        '429': {$ref: '#/components/responses/AILimit'}
        '502': {$ref: '#/components/responses/AIBadGateway'}
        '503': {$ref: '#/components/responses/AIOff'}
        '504': {$ref: '#/components/responses/AITimeout'}
  /v1/task/ai-insight/preview:
    post:
      tags: [AI Insight]
      summary: AI analysis for a site that is not saved yet ("Buat analisis AI"); nothing stored
      description: |
        Roles - all. Same limits as generate. Send the answer back later as `insight` in
        `POST /v1/task/{status}` to store it without a second Gemini call. Only `site.site_lat`/`site_lon` are required,
        plus at least one survey input in `context` (else 400, baru 27 Okt).
        Revising a returned request or a reopened draft: send its `site_id` (baru, 27 Okt); when the form's inputs
        equal those of the site's newest insight the answer is 409 (no call). Send the answer's `input_hash` back
        inside `insight` on save so the next check knows the inputs.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: aiPreview
      x-mobile-app: "used: \"Buat analisis AI\" in the form"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_id: {type: string, description: '(baru, 27 Okt, optional) the saved request being revised / the reopened draft', example: SD28102026001}
                site: {$ref: '#/components/schemas/PreviewSiteInput'}
                context: {$ref: '#/components/schemas/SiteContextInput'}
            example:
              site: {site_name_1: Uji Kemang Raya, site_lat: -6.2615, site_lon: 106.8106, site_sales_area: 120}
              context: {foot_traffic_observation: Ramai sore hari, vehicle_traffic_level: BUSY}
      responses:
        '200':
          description: Insight (not stored)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/AIInsight'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '400': {$ref: '#/components/responses/AIEmptyInputs'}
        '403': {$ref: '#/components/responses/NoToken'}
        '409': {$ref: '#/components/responses/AIUnchanged'}
        '422':
          description: Coordinates missing (0)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 422, status: failure, message: Unprocessable Entity, errors: {site.site_lat: The site lat field is required., site.site_lon: The site lon field is required.}}
        '429': {$ref: '#/components/responses/AILimit'}
        '502': {$ref: '#/components/responses/AIBadGateway'}
        '503': {$ref: '#/components/responses/AIOff'}
        '504': {$ref: '#/components/responses/AITimeout'}
  /v1/task/ai-insight/quota:
    get:
      tags: [AI Insight]
      summary: AI analyses left ("Sisa analisis AI")
      description: |
        Roles - all. `limit`/`remaining` = the caller's own per day. With `?lat=&lng=` (or `?site_id=`) and the
        per-site limit on, `site` is added; with the daily cap on, `server_today` is added.
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: aiQuota
      x-mobile-app: "used: \"Sisa analisis AI\" under the AI button"
      parameters:
        - {name: lat, in: query, schema: {type: number, format: double}}
        - {name: lng, in: query, schema: {type: number, format: double}}
        - {name: site_id, in: query, schema: {type: string}}
      responses:
        '200':
          description: Limits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/AIQuota'}
              example:
                code: 200
                status: success
                data:
                  limit: 10
                  remaining: 7
                  site: {limit: 5, used: 0, remaining: 5}
                  server_today: {limit: 60, used: 3, remaining: 57}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '422': {$ref: '#/components/responses/BadLatLng'}
  /v1/task/ai-insight/{site_id}:
    get:
      tags: [AI Insight]
      summary: The newest stored AI analysis of a site (what approvers see)
      description: Roles - all. A site without an analysis answers 500 `record not found` (old behaviour; the app shows "Belum ada analisis AI").
      x-roles: [USER, DEPT_HEAD, DIV_HEAD, ADMIN]
      operationId: aiGet
      x-mobile-app: "used: detail \"Survei & AI\" tab; form after a revision"
      parameters:
        - $ref: '#/components/parameters/SiteIdPath'
      responses:
        '200':
          description: Insight
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: {$ref: '#/components/schemas/AIInsight'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/NoToken'}
        '500':
          description: No analysis for this site yet (old behaviour, a 404 would be cleaner)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorEnvelope'}
              example: {code: 500, status: failure, message: Internal Server Error, errors: {error: 'insight for site SD28102026001: record not found'}}

